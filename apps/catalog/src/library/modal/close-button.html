<button
	class="btn"
	onclick="document.getElementById('modal-close-button').showModal()"
>
	Open modal
</button>
<dialog id="modal-close-button" class="modal">
	<div class="modal-box">
		<form method="dialog">
			<button
				class="btn absolute top-2 right-2 btn-circle btn-ghost btn-sm"
			>
				✕
			</button>
		</form>
		<h3 class="text-lg font-bold">Hello!</h3>
		<p class="py-4">Press ESC key or click on ✕ button to close</p>
	</div>
</dialog>
