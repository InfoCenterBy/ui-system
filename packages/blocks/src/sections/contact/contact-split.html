<section class="bg-base-100 px-4 py-16">
	<div class="mx-auto grid max-w-6xl gap-10 md:grid-cols-2">
		<div>
			<h2 class="text-3xl font-bold" data-edit="text">Contact us</h2>
			<p class="mt-3 text-base-content/70" data-edit="rich">
				We are happy to answer your questions.
			</p>
			<ul class="mt-8 space-y-5">
				<li class="flex items-start gap-3" data-repeat="contact">
					<svg
						class="size-5 shrink-0 text-primary"
						viewBox="0 0 24 24"
						fill="none"
						stroke="currentColor"
						stroke-width="2"
					>
						<path
							d="M12 21s-7-6.5-7-12a7 7 0 0114 0c0 5.5-7 12-7 12z"
						/>
						<circle cx="12" cy="9" r="2.5" />
					</svg>
					<div>
						<p class="font-semibold" data-edit="text">Address</p>
						<p class="text-base-content/70" data-edit="text">
							12 Main Street, Springfield
						</p>
					</div>
				</li>
				<li class="flex items-start gap-3" data-repeat="contact">
					<svg
						class="size-5 shrink-0 text-primary"
						viewBox="0 0 24 24"
						fill="none"
						stroke="currentColor"
						stroke-width="2"
					>
						<rect x="3" y="5" width="18" height="14" rx="2" />
						<path d="M3 7l9 6 9-6" />
					</svg>
					<div>
						<p class="font-semibold" data-edit="text">Email</p>
						<p class="text-base-content/70" data-edit="text">
							hello@example.com
						</p>
					</div>
				</li>
				<li class="flex items-start gap-3" data-repeat="contact">
					<svg
						class="size-5 shrink-0 text-primary"
						viewBox="0 0 24 24"
						fill="none"
						stroke="currentColor"
						stroke-width="2"
					>
						<path
							d="M5 4h4l2 5-2.5 1.5a11 11 0 005 5L15 13l5 2v4a2 2 0 01-2 2A16 16 0 013 6a2 2 0 012-2z"
						/>
					</svg>
					<div>
						<p class="font-semibold" data-edit="text">Phone</p>
						<p class="text-base-content/70" data-edit="text">
							+1 555 010 2030
						</p>
					</div>
				</li>
			</ul>
		</div>
		<form class="space-y-4" action="#">
			<label class="flex w-full flex-col gap-1"
				><span class="mb-1 block text-sm font-medium" data-edit="text"
					>Name</span
				><input class="input w-full" type="text" name="name" /></label
			><label class="flex w-full flex-col gap-1"
				><span class="mb-1 block text-sm font-medium" data-edit="text"
					>Email</span
				><input class="input w-full" type="email" name="email" /></label
			><label class="flex w-full flex-col gap-1"
				><span class="mb-1 block text-sm font-medium" data-edit="text"
					>Message</span
				><textarea
					class="textarea h-32 w-full"
					name="message"
				></textarea></label
			><button
				class="btn w-full btn-primary"
				type="submit"
				data-edit="text"
			>
				Send message
			</button>
		</form>
	</div>
</section>
