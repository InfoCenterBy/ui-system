<section class="bg-base-100 px-4 py-16">
	<div class="mx-auto max-w-2xl">
		<h2 class="text-center text-3xl font-bold" data-edit="text">
			Get in touch
		</h2>
		<p
			class="mx-auto mt-3 max-w-2xl text-center text-base-content/70"
			data-edit="rich"
		>
			Send us a message and we will reply within one business day.
		</p>
		<form class="mt-10 space-y-4" action="#">
			<label class="flex w-full flex-col gap-1"
				><span class="mb-1 block text-sm font-medium" data-edit="text"
					>Name</span
				><input class="input w-full" type="text" name="name" /></label
			><label class="flex w-full flex-col gap-1"
				><span class="mb-1 block text-sm font-medium" data-edit="text"
					>Email</span
				><input class="input w-full" type="email" name="email" /></label
			><label class="flex w-full flex-col gap-1"
				><span class="mb-1 block text-sm font-medium" data-edit="text"
					>Message</span
				><textarea
					class="textarea h-32 w-full"
					name="message"
				></textarea></label
			><button
				class="btn w-full btn-primary"
				type="submit"
				data-edit="text"
			>
				Send message
			</button>
		</form>
	</div>
</section>
