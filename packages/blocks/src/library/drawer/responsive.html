<div class="drawer h-80 lg:drawer-open">
	<input id="drawer-responsive" type="checkbox" class="drawer-toggle" />
	<div class="drawer-content flex items-center justify-center">
		<label
			for="drawer-responsive"
			class="btn drawer-button btn-primary lg:hidden"
			>Open drawer</label
		>
		<p class="max-lg:hidden">The sidebar stays open on large screens</p>
	</div>
	<div class="drawer-side">
		<label
			for="drawer-responsive"
			aria-label="close sidebar"
			class="drawer-overlay"
		></label>
		<ul class="menu min-h-full w-56 bg-base-100 p-4">
			<li><a>Sidebar Item 1</a></li>
			<li><a>Sidebar Item 2</a></li>
		</ul>
	</div>
</div>
