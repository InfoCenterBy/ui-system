<button
	class="btn"
	onclick="document.getElementById('modal-backdrop-close').showModal()"
>
	Open modal
</button>
<dialog id="modal-backdrop-close" class="modal">
	<div class="modal-box">
		<h3 class="text-lg font-bold">Hello!</h3>
		<p class="py-4">Click outside to close</p>
	</div>
	<form method="dialog" class="modal-backdrop">
		<button>close</button>
	</form>
</dialog>
