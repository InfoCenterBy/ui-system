<span class="countdown font-mono text-6xl">
	<span
		id="countdown-large"
		style="--value: 42"
		aria-live="polite"
		aria-label="42"
		>42</span
	>
</span>
<script>
	{
		// Counts down from 42 and starts over
		const el = document.getElementById('countdown-large')
		let value = 42
		setInterval(() => {
			value = value > 0 ? value - 1 : 42
			el.style.setProperty('--value', value)
			el.setAttribute('aria-label', value)
			el.textContent = value
		}, 1000)
	}
</script>
