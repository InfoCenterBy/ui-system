<button
	class="btn"
	onclick="document.getElementById('modal-default').showModal()"
>
	Open modal
</button>
<dialog id="modal-default" class="modal">
	<div class="modal-box">
		<h3 class="text-lg font-bold">Hello!</h3>
		<p class="py-4">Press ESC key or click the button below to close</p>
		<div class="modal-action">
			<form method="dialog">
				<button class="btn">Close</button>
			</form>
		</div>
	</div>
</dialog>
