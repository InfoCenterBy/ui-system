<button
	class="btn"
	onclick="document.getElementById('modal-custom-width').showModal()"
>
	Open modal
</button>
<dialog id="modal-custom-width" class="modal">
	<div class="modal-box w-11/12 max-w-5xl">
		<h3 class="text-lg font-bold">Hello!</h3>
		<p class="py-4">Set any width on modal-box</p>
		<div class="modal-action">
			<form method="dialog">
				<button class="btn">Close</button>
			</form>
		</div>
	</div>
</dialog>
